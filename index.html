
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> <!-- For icons -->
    <style>
        /* Global Styles */
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            color: #333;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: #4a90e2;
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header i {
            margin-right: 10px;
            font-size: 1.2em;
        }

        .form-section {
            padding: 30px;
            background: #f9f9f9;
            border-bottom: 1px solid #e0e0e0;
        }

        .form {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 200px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.5);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s, transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .add-btn {
            background: #28a745;
            color: white;
        }

        .add-btn:hover {
            background: #218838;
        }

        .clear-btn {
            background: #dc3545;
            color: white;
        }

        .clear-btn:hover {
            background: #c82333;
        }

        .search-section {
            padding: 20px 30px;
            background: white;
        }

        #search {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #f1f1f1;
            font-weight: bold;
            color: #555;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .edit-btn {
            background: #ffc107;
            color: #212529;
        }

        .edit-btn:hover {
            background: #e0a800;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        footer {
            background: #4a90e2;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 0.9em;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .form {
                flex-direction: column;
                align-items: center;
            }

            input {
                width: 100%;
                max-width: 300px;
            }

            table {
                font-size: 0.9em;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-graduation-cap"></i> Student Management System</h1>
        </header>

        <section class="form-section">
            <div class="form">
                <input type="text" id="name" placeholder="Student Name">
                <input type="text" id="roll" placeholder="Roll Number">
                <input type="text" id="course" placeholder="Course">
                <input type="email" id="email" placeholder="Email">
                <button class="add-btn" onclick="addStudent()"><i class="fas fa-plus"></i> Add Student</button>
                <button class="clear-btn" onclick="clearAllStudents()"><i class="fas fa-trash"></i> Clear All</button>
            </div>
        </section>

        <section class="search-section">
            <input type="text" id="search" placeholder="Search by name, roll, course, or email..." onkeyup="searchStudents()">
        </section>

        <table>
            <thead>
                <tr>
                    <th><i class="fas fa-user"></i> Name</th>
                    <th><i class="fas fa-id-card"></i> Roll</th>
                    <th><i class="fas fa-book"></i> Course</th>
                    <th><i class="fas fa-envelope"></i> Email</th>
                    <th><i class="fas fa-cogs"></i> Actions</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>

        <footer>
            <p>&copy; 2023 Student Management System. Built with <i class="fas fa-heart"></i> for efficiency.</p>
        </footer>
    </div>

    <script>
        // Load students from localStorage on page load
        document.addEventListener('DOMContentLoaded', loadStudents);

        function addStudent() {
            let name = document.getElementById("name").value.trim();
            let roll = document.getElementById("roll").value.trim();
            let course = document.getElementById("course").value.trim();
            let email = document.getElementById("email").value.trim();

            // Validation
            if (name === "" || roll === "" || course === "" || email === "") {
                alert("Please fill all fields");
                return;
            }
            if (!isValidEmail(email)) {
                alert("Please enter a valid email");
                return;
            }
            if (isRollDuplicate(roll)) {
                alert("Roll number already exists");
                return;
            }

            let student = { name, roll, course, email };
            saveStudent(student);
            displayStudent(student);

            // Clear form
            document.getElementById("name").value = "";
            document.getElementById("roll").value = "";
            document.getElementById("course").value = "";
            document.getElementById("email").value = "";
        }

        function displayStudent(student, index = null) {
            let table = document.getElementById("studentTable");
            let row = index !== null ? table.rows[index] : table.insertRow();

            row.innerHTML = `
                <td>${student.name}</td>
                <td>${student.roll}</td>
                <td>${student.course}</td>
                <td>${student.email}</td>
                <td class="actions">
                    <button class="edit-btn" onclick="editStudent(${index !== null ? index : table.rows.length - 1})"><i class="fas fa-edit"></i> Edit</button>
                    <button class="delete-btn" onclick="deleteStudent(${index !== null ? index : table.rows.length - 1})"><i class="fas fa-trash"></i> Delete</button>
                </td>
            `;
        }

        function editStudent(index) {
            let students = getStudents();
            let student = students[index];

            // Populate form with current values
            document.getElementById("name").value = student.name;
            document.getElementById("roll").value = student.roll;
            document.getElementById("course").value = student.course;
            document.getElementById("email").value = student.email;

            // Change button to update
            let addBtn = document.querySelector('.add-btn');
            addBtn.innerHTML = '<i class="fas fa-save"></i> Update Student';
            addBtn.onclick = () => updateStudent(index);
        }

        function updateStudent(index) {
            let name = document.getElementById("name").value.trim();
            let roll = document.getElementById("roll").value.trim();
            let course = document.getElementById("course").value.trim();
            let email = document.getElementById("email").value.trim();

            if (name === "" || roll === "" || course === "" || email === "") {
                alert("Please fill all fields");
                return;
            }
            if (!isValidEmail(email)) {
                alert("Please enter a valid email");
                return;
            }

            let students = getStudents();
            students[index] = { name, roll, course, email };
            localStorage.setItem('students', JSON.stringify(students));
            displayStudent(students[index], index);

            // Reset form and button
            document.getElementById("name").value = "";
            document.getElementById("roll").value = "";
            document.getElementById("course").value = "";
            let addBtn = document.querySelector('.add-btn');
            addBtn.innerHTML = '<i class="fas fa-plus"></i> Add Student';
            addBtn.onclick = addStudent;
        }

        function deleteStudent(index) {
            if (confirm("Are you sure you want to delete this student?")) {
                let students = getStudents();
                students.splice(index, 1);
                localStorage.setItem('students', JSON.stringify(students));
                loadStudents(); // Reload table
            }
        }

        function clearAllStudents() {
            if (confirm("Are you sure you want to clear all students?")) {
                localStorage.removeItem('students');
                document.getElementById("studentTable").innerHTML = "";
            }
        }

        function searchStudents() {
            let query = document.getElementById("search").value.toLowerCase();
            let rows = document.getElementById("studentTable").rows;

            for (let i = 0; i < rows.length; i++) {
                let cells = rows[i].cells;
                let match = false;
                for (let j = 0; j < cells.length - 1; j++) { // Exclude actions column
                    if (cells[j].textContent.toLowerCase().includes(query)) {
                        match = true;
                        break;
                    }
                }
                rows[i].style.display = match ? "" : "none";
            }
        }

        function loadStudents() {
            let students = getStudents();
            let table = document.getElementById("studentTable");
            table.innerHTML = "";
            students.forEach(displayStudent);
        }

        function getStudents() {
            return JSON.parse(localStorage.getItem('students')) || [];
        }

        function saveStudent(student) {
            let students = getStudents();
            students.push(student);
            localStorage.setItem('students', JSON.stringify(students));
        }

        function isValidEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        function isRollDuplicate(roll) {
            let students = getStudents();
            return students.some(student => student.roll === roll);
        }
    </script>
</body>
</html>
